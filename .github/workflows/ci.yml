# Why: there was a .github/ folder but no CI. Every push now gets shellcheck +
# pre-commit so quoting bugs and formatting regressions fail fast in PR, not
# six months later on a fresh machine install.
name: ci

# Why quoted: YAML parses the bare word `on` as boolean true, which some
# schema validators then reject. Quoting keeps it a plain string key.
"on":
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck & shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # shfmt via Go install keeps the version pinned alongside pre-commit
          curl -sSL https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64 \
            -o /usr/local/bin/shfmt
          sudo chmod +x /usr/local/bin/shfmt

      - name: ShellCheck
        run: |
          find src/scripts src/dotfiles/claude/plugins -name '*.sh' | sort \
            | xargs shellcheck -x --severity=warning
          shellcheck -x --severity=warning src/dotfiles/claude/statusline-command.sh

      # The claude CLI isn't available on the runner, so validate what we can:
      # both manifests parse, and every plugin the marketplace lists exists with
      # a plugin.json and a matching name. Catches the rename-and-forget class of
      # break that only shows up as "plugin not found" on a fresh install.
      - name: Validate Claude marketplace manifests
        run: |
          MP=src/dotfiles/claude/.claude-plugin/marketplace.json
          MPDIR=src/dotfiles/claude
          PLUGINS=src/dotfiles/claude/plugins
          jq -e . "$MP" > /dev/null
          jq -r '.plugins[].source' "$MP" | while read -r src; do
            manifest="$MPDIR/${src#./}/.claude-plugin/plugin.json"
            test -f "$manifest" || { echo "❌ missing $manifest"; exit 1; }
            jq -e . "$manifest" > /dev/null
          done
          jq -r '.plugins[] | "\(.name) \(.source)"' "$MP" |
            while read -r name src; do
              actual=$(jq -r .name "$MPDIR/${src#./}/.claude-plugin/plugin.json")
              test "$name" = "$actual" || {
                echo "❌ marketplace lists '$name' but ${src} declares '$actual'"; exit 1; }
            done
          # Every SKILL.md needs name + description frontmatter or Claude never loads it.
          find "$PLUGINS" -name SKILL.md | while read -r skill; do
            head -1 "$skill" | grep -qx -- '---' || { echo "❌ $skill: no frontmatter"; exit 1; }
            grep -qE '^name:' "$skill" || { echo "❌ $skill: no name:"; exit 1; }
            grep -qE '^description:' "$skill" || { echo "❌ $skill: no description:"; exit 1; }
          done
          # A token in .mcp.json is a leak: every server must use OAuth or a local CLI
          # profile. gitleaks catches known token formats; this catches the shape.
          for mcp in $(find "$PLUGINS" -name '.mcp.json'); do
            jq -e . "$mcp" > /dev/null
            jq -e 'any(.mcpServers[]?; (.headers // {}) | keys[]? | ascii_downcase == "authorization")' \
              "$mcp" > /dev/null && { echo "❌ $mcp: Authorization header — use OAuth"; exit 1; }
            grep -qiE '"(token|password|secret|api_?key)" *:' "$mcp" \
              && { echo "❌ $mcp: inline credential key"; exit 1; }
          done
          echo "✅ marketplace manifests OK"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1

  # Why: branch-name check matches the GitLab policy Batman already uses at
  # work, so personal repos fail early with the same rules.
  branch-name:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate branch name
        run: |
          BRANCH="${{ github.head_ref }}"
          PATTERN='^((feature|bugfix|hotfix|release|chore|config)/.+|main|master)$'
          if ! [[ "$BRANCH" =~ $PATTERN ]]; then
            echo "❌ Branch '$BRANCH' does not match $PATTERN"
            exit 1
          fi
          echo "✅ Branch name OK: $BRANCH"
